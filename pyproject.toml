[project]
name = "data-engineering"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MikolajZasko", email = "mikolaj.zasko890290@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "geopandas==1.2.0",
    "matplotlib==3.11.2",
    "numpy==2.5.3",
    "openpyxl==3.1.5",
    "pandas==3.1.0",
    "rasterio==1.5.2",
    "shapely==2.1.2",
    "tabulate==0.10.0",
]

[project.scripts]
data-engineering = "data_engineering:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "other_venv",
]
